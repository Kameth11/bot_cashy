name: Backup diario

# Volcado propio de la base (pg_dump) y de los comprobantes del bucket, cifrado y
# guardado como artefacto del workflow (privado, 30 días). Existe porque el plan
# gratuito de Supabase no trae copias confiables. Ver RESPALDOS.md.
on:
  schedule:
    - cron: '17 6 * * *' # 03:17 hora de Argentina
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Verificar secretos
        run: |
          for v in SUPABASE_DB_URL BACKUP_PASSPHRASE SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secreto $v (ver RESPALDOS.md)"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Cliente de Postgres 16
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
      - run: npm ci --omit=dev
      - name: Volcar base y comprobantes
        run: |
          mkdir -p backup/comprobantes
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges --schema=public --format=custom --file=backup/base.dump
          node scripts/backup-comprobantes.js backup/comprobantes
          # Sanidad: el volcado tiene que ser legible y contener tablas.
          pg_restore --list backup/base.dump | grep -q "TABLE DATA" || { echo "::error::El volcado no tiene datos"; exit 1; }
      - name: Empaquetar y cifrar
        run: |
          FECHA=$(date -u +%Y-%m-%d)
          tar -czf - -C backup . | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o "cashy-backup-$FECHA.tar.gz.gpg"
          ls -lh cashy-backup-*.gpg
      - uses: actions/upload-artifact@v4
        with:
          name: cashy-backup
          path: cashy-backup-*.gpg
          retention-days: 30
          if-no-files-found: error
